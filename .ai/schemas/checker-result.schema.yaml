$schema: https://json-schema.org/draft/2020-12/schema
title: Governance Checker Result
type: object
required:
  - checker_id
  - passed
  - status
  - failed_check_ids
  - findings
properties:
  checker_id:
    type: string
    minLength: 1
  passed:
    type: boolean
  status:
    type: string
    enum:
      - passed
      - failed
  failed_check_ids:
    type: array
    items:
      type: string
  findings:
    type: array
    items:
      type: object
      required:
        - check_id
        - severity
        - message
      properties:
        check_id:
          type: string
        severity:
          type: string
          enum:
            - error
            - warning
            - info
        message:
          type: string
  metadata:
    type: object
additionalProperties: false
