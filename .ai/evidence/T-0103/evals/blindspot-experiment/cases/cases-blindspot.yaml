  title: '[S2/A] 盲点清单表格结构存在（B 编号行）'
  input: '# 开工产出 —— 执行前声明 + 盲点清单（实验组 A，含盲点自检提示词）


    ## 执行前声明


    任务理解：为"小型订单管理系统"设计应用架构（模块划分 + 数据模型），受众为开发团队，仅架构设计文档、不做实现与技术选型对比。

    执行计划：（一）订单/商品/客户三域模块划分；（二）核心实体与关系建模；（三）文档整理为可直接开工形态。

    盲点核对：以下盲点清单已随执行前简报一次性呈现用户核对，确认后开工。


    ## 盲点清单


    | # | 盲点变量 | 若不考虑会怎样（后果） | 需要用户确认？ | 确认方式 |

    |---|---|---|---|---|

    | B1 | 未来扩展规模——单体还是预留扩展点 | 单体假设在业务扩大时需整体重构 | 是 | 随执行前简报一次确认 |

    | B2 | 第三方服务依赖（支付/物流）可用性 | 依赖故障时无降级路径，线上不可用 | 是 | 随执行前简报一次确认 |

    | B3 | 部署环境——内网还是公网 | 安全设计与证书策略完全不同，公网部署无防护=事故 | 是 | 随执行前简报一次确认 |

    | B4 | 存量数据迁移成本 | 上线时历史数据无法导入=返工 | 否（AI 兜底：设计兼容导入接口，不阻塞架构） | 无需确认 |

    '
