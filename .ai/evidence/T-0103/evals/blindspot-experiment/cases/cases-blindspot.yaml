  title: '[S1/A] 盲点清单表格结构存在（B 编号行）'
  input: '# 开工产出 —— 执行前声明 + 盲点清单（实验组 A，含盲点自检提示词）


    ## 执行前声明


    任务理解：整理"个人待办 Web 应用"需求文档（用户故事 + 验收标准），面向非技术个人用户，仅需求整理、不涉及技术选型。

    执行计划：（一）核心场景用户故事；（二）验收标准表格；（三）非技术语言复查。

    盲点核对：以下盲点清单已随执行前简报一次性呈现用户核对，确认后开工。


    ## 盲点清单


    | # | 盲点变量 | 若不考虑会怎样（后果） | 需要用户确认？ | 确认方式 |

    |---|---|---|---|---|

    | B1 | 目标设备类型——移动端还是桌面端 | 只做桌面布局，移动用户不可用，验收阶段才发现=返工 | 是 | 随执行前简报一次确认 |

    | B2 | 数据量级——几十条还是几十万条 | 内存方案在数据量级大时不可用，需要换存储方案 | 是 | 随执行前简报一次确认 |

    | B3 | 数据隐私——待办内容是否含个人信息 | 本地存储个人数据违反合规，上线前才发现 | 是 | 随执行前简报一次确认 |

    | B4 | 浏览器兼容范围 | 只支持最新 Chrome，老浏览器用户不可用 | 否（AI 兜底：按最近两年主流版本兼容处理） | 无需确认 |

    '
