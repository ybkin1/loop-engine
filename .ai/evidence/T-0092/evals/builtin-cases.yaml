- case_id: EVAL-GUARD-005
  title: 已批准 gate 范围内的治理写入应放行 (positive)
  input:
    tool_call:
      tool_name: Write
      tool_input:
        file_path: .ai/tasks/X.md
    guard_response:
      guard: gate_guard
