project_continuity:
  user_origin:
    audience: 单人AI辅助软件研发
    capability_assumptions:
    - 用户无代码能力
    - 用户无项目管理背景
    user_authorities:
    - 批准gate
    - 拒绝gate
    - 请求修复
    - 提出目标
  product_identity:
    project_id: loop-engine
    one_sentence_outcome: 帮助无代码能力的用户以Loop工程方式从需求到可交付软件
    north_star: 每个非技术用户都能借助AI交付可用软件
    success_signals:
    - 治理流程可被非技术用户理解
    - gate机制有效阻断未授权操作
    - 证据链完整可审计
  design_language:
    terms: {}
    forbidden_equivalences: []
  engineering_invariants:
    architecture: Loop工程治理插件架构
    technology: Python 3.10+, ZCode Plugin API
    interfaces: ZCode Hook协议, MCP JSON-RPC
    coding_standards: PEP 8
    quality: test coverage >= 80%
    security: no hardcoded secrets
  authorization_boundaries:
    allowed_effects:
    - read
    - write governance files
    forbidden_effects:
    - deploy
    - rollback
    - database
    - permission
    - secret
    - payment
    - production_data
    - migration
    current_gate_id: null
  lifecycle:
    phase: S6-delivery
    task_id: null
    task_status: null
    active_transaction_ids: []
    in_flight_actor_ids: []
  evidence_index:
    canonical: []
    additive: []
    superseded_not_deleted: []
  revision_lineage:
    parent_revision: null
    change_set_id: init-v1
    impact_assessment_ref: null
    approval_ref: null
  protected_decisions:
  - decision_id: MEANS_END_BOUNDARY
    statement: AI负责手段，用户负责目标和gate批准
    rationale_ref: .ai/DECISIONS.md
    authority_ref: user
    change_policy: 需用户显式gate批准
  - decision_id: USER_AUTHORITY
    statement: 只有用户能批准gate、拒绝gate、请求修复
    rationale_ref: .ai/DECISIONS.md
    authority_ref: user
    change_policy: 不可变更
  - decision_id: CODEX_DELIVERY_RESPONSIBILITY
    statement: AI负责在批准范围内完成交付
    rationale_ref: .ai/DECISIONS.md
    authority_ref: user
    change_policy: 需用户显式gate批准
  - decision_id: EVIDENCE_ONLY_BOUNDARY
    statement: reviewer PASS、测试通过、validator成功仅为evidence，不替代用户批准
    rationale_ref: .ai/DECISIONS.md
    authority_ref: user
    change_policy: 不可变更
