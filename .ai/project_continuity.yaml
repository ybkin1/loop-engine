    rationale_ref: .ai/DECISIONS.md
    authority_ref: user
    change_policy: 需用户显式gate批准
  - decision_id: USER_AUTHORITY
    statement: 只有用户能批准gate、拒绝gate、请求修复
    rationale_ref: .ai/DECISIONS.md
    authority_ref: user
    change_policy: 不可变更
