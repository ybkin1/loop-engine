    - 批准gate
    - 拒绝gate
    - 请求修复
    - 提出目标
  product_identity:
    project_id: loop-engine
    one_sentence_outcome: 帮助无代码能力的用户以Loop工程方式从需求到可交付软件
    north_star: 每个非技术用户都能借助AI交付可用软件
    success_signals:
    - 治理流程可被非技术用户理解
    - gate机制有效阻断未授权操作
    - 证据链完整可审计
  design_language:
    terms: {}
    forbidden_equivalences: []
  engineering_invariants:
    architecture: Loop工程治理插件架构
    technology: Python 3.10+, ZCode Plugin API
    interfaces: ZCode Hook协议, MCP JSON-RPC
    coding_standards: PEP 8
    quality: test coverage >= 80%
    security: no hardcoded secrets
  authorization_boundaries:
    allowed_effects:
    - read
    - write governance files
    forbidden_effects:
    - deploy
    - rollback
    - database
    - permission
    - secret
    - payment
    - production_data
    - migration
