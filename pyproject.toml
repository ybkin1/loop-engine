[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-engine"
version = "3.0.0"
description = "Loop 工程软件交付系统 — 把 AI 编码变成具备完整软件工程纪律的可交付系统"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Loop Engine Contributors" },
]
keywords = ["ai", "software-engineering", "governance", "quality-gates", "code-review"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pyyaml>=6.0",
]
lint = [
    "ruff>=0.1",
]
typecheck = [
    "mypy>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501", "E741", "N806", "B007"]

[tool.ruff.lint.per-file-ignores]
"codex_loop/hooks/_hook_bash.py" = ["E701", "E702"]
"codex_loop/governance/repair_continuity.py" = ["E701", "E702"]
"codex_loop/hooks/hook_common.py" = ["F401"]
"codex_loop/hooks/loop_auto_activate.py" = ["B005", "E402"]
"codex_loop/hooks/session_brief.py" = ["E402"]
"codex_loop/hooks/ledger_guard.py" = ["E402"]
"codex_loop/hooks/loop_enforcement.py" = ["E402"]
"codex_loop/core/contracts.py" = ["E402"]
"codex_loop/roles/capability.py" = ["E402"]
"codex_loop/governance/validate_state.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
