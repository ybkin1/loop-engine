[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-engine"
version = "3.11.2"
description = "Loop 工程软件交付系统 — 把 AI 编码变成具备完整软件工程纪律的可交付系统"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# T-0085 (C9 debt payment): the runtime dependency set was only declared in
# optional-dependencies/requirements.txt; [project].dependencies was empty.
# PyYAML is the only runtime third-party distribution actually imported.
dependencies = [
    "PyYAML>=6.0",
]
authors = [
    { name = "Loop Engine Contributors" },
]
keywords = ["ai", "software-engineering", "governance", "quality-gates", "code-review"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "tomli>=2.0; python_version < '3.11'",
]
lint = [
    "ruff>=0.1",
]
typecheck = [
    "mypy>=1.0",
]
# T-0085 (C9 TYPE-C debt payment): scripts/runtime_delivery_gate.py lazily
# imports playwright inside try/except ImportError for the browser smoke
# check — an optional dependency by design. Declared here so the import
# checker resolves it (no C9 false positive if scripts/ is scanned).
browser = [
    "playwright>=1.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
