[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-engine"
version = "3.12.48"
description = "Loop 工程软件交付系统 — 把 AI 编码变成具备完整软件工程纪律的可交付系统"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# T-0085 (C9 debt payment): the runtime dependency set was only declared in
# optional-dependencies/requirements.txt; [project].dependencies was empty.
# PyYAML is the only runtime third-party distribution actually imported.
dependencies = [
    "PyYAML>=6.0",
]
authors = [
    { name = "Loop Engine Contributors" },
]
keywords = ["ai", "software-engineering", "governance", "quality-gates", "code-review"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "tomli>=2.0; python_version < '3.11'",
]
lint = [
    "ruff>=0.1",
]
typecheck = [
    "mypy>=1.0",
]
# T-0085 (C9 TYPE-C debt payment): scripts/runtime_delivery_gate.py lazily
# imports playwright inside try/except ImportError for the browser smoke
# check — an optional dependency by design. Declared here so the import
# checker resolves it (no C9 false positive if scripts/ is scanned).
browser = [
    "playwright>=1.40",
]

# D8 (T-0098): 显式锁定可分发包。wheel/sdist 只含 src/loop_engine（src 布局）
# 与顶层 loop_core（含 llm 子包）；顶层遗留 loop_engine/（flat-layout 时代的
# adapters/cost_tracker 等，未被任何代码导入）与 src/loop_engine 同名冲突，
# 显式排除在分发之外。
[tool.setuptools]
package-dir = { "" = "src", "loop_core" = "loop_core" }
packages = ["loop_engine", "loop_core", "loop_core.llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# T-0110 批 B-1/B-2: re-export 壳文件——未使用的导入是设计意图
# （保持拆分前 dir()/import * 公开面逐名一致，见 golden 等价测试）。其余
# 文件 F401 照常生效。
"loop_core/governance_metrics.py" = ["F401"]
"loop_core/intent_router.py" = ["F401"]
"loop_core/human_review_packet.py" = ["F401"]
"loop_core/context_loader.py" = ["F401"]
# T-0110 批 C: loop_enforcement 壳——拆分 re-export 绑定未在本文件体内
# 使用是设计意图（保持拆分前 dir()/import * 公开面逐名一致，见 golden
# 等价测试）；GOVERNANCE_TOOL_DIRS tuple 字面量保留为 T-0109 AC-05 门禁
# 的 AST 断言目标（与 loop_enforcement_constants 双登记，一致性测试锁定）。
"hooks/scripts/loop_enforcement.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
