# loop-governance 行为配置
# 安装位置：.zcode/skills/loop-governance/config.yaml
# 三个 hook 脚本每次运行时读取本文件；缺失或损坏时回退到 hook_common.py 的默认值。

version: 1

gate_guard:
  enabled: true
  # closed: 状态文件不可读时阻断写入（默认，安全姿态）
  # open:   状态文件不可读时放行并在 stderr 警告（仅排障时临时使用）
  fail_on_state_error: closed
  # gate 状态异常（missing/rejected/blocked）时仍允许写入的治理文件路径
  # 防止 fail-closed 死锁：无法写 gates.yaml/state.yaml/task_graph.yaml 修复状态
  decision_recording_exempt:
    - .ai/gates.yaml
    - .ai/state.yaml
    - .ai/task_graph.yaml
    - .ai/project_continuity.yaml

path_guard:
  enabled: true
  # ask:  返回 permissionDecision=ask，由用户在客户端当场确认（默认，用户即信任锚）
  # deny: exit 2 硬阻断；仅在需要"任何情况下都不得写保护区"时使用
  decision: ask
  # 保护区：治理权威事实与执行层。目录以 / 结尾表示前缀匹配。
  protected_paths:
    - AGENTS.md
    - stable/
    - registry/
    - .zcode/config.json
    - .zcode/tools/

session_brief:
  enabled: true
  # 注入的 pending gate 列表最多条数，超出折叠计数
  max_pending_listed: 10

# ── 记忆注入配置（T-0104 设计-5） ──
# 非 hook 配置。由 role_orchestrator / context_packager 读取：
# phases 列表内（S4 及之后）的阶段派发角色上下文时，显式传 include_memories=True、
# memory_limit=N（context_loader 默认值保持 False 不动，仅调用点开启）。
# enabled: false 时完全回退到现状（不注入）。记忆注入为纯附加节，空召回即 no-op。
memory_injection:
  enabled: true
  phases: ["S4", "S5", "S6", "S8", "S9", "S10"]
  memory_limit: 5

# ── 质量门禁配置（质量工程师 agent 使用） ──
# 被 agents/quality-engineer/scripts/run_quality_gates.py 读取。
# 每个项目的实际命令和门槛在此定义。
# 模板定义了常用语言的推荐配置，project_type 指定当前使用的模板。

quality_gates:
  project_type: auto       # auto = 自动检测（有 pyproject.toml → python，有 package.json → javascript）

  # 通用配置（project_type: default 时使用，也可被模板覆盖）
  lint_threshold: 0
  typecheck_threshold: 0
  test_threshold: 0
  coverage_threshold: 80
  audit_threshold:
    HIGH: 0
    CRITICAL: 0
  build_threshold: 0

  # 语言模板：project_type 匹配时自动应用
  templates:
    javascript:
      lint_command: "npx eslint src/ --format json"
      typecheck_command: "npx tsc --noEmit"
      test_command: "npx vitest run --coverage"
      audit_command: "npm audit --json"
      build_command: "npm run build"

    python:
      lint_command: "ruff check --output-format json ."
      typecheck_command: "mypy --strict src/"
      test_command: "pytest --cov=src --cov-report=term --tb=short -q"
      audit_command: "pip-audit -r requirements.txt --format json"
      build_command: "python -m build"

    default:
      # 未识别语言时的保守配置：只跑测试和 lint（如果命令存在）
      lint_command: null
      typecheck_command: null
      test_command: null
      audit_command: null
      build_command: null

# ── 角色能力认证配置 ──
# 控制角色在生产任务前的认证要求。对应 agents/references/certification-system.md。
# 认证状态文件维护在 .ai/certifications/state.yaml（由 main-thread 自动管理）。

certification:
  # 是否启用认证要求。
  #   true:  角色在接受生产任务前必须持有有效认证（CERTIFIED 或 CERTIFIED_WITH_NOTES）。
  #          未认证角色的生产任务分配被 main-thread 拦截。
  #   false: 认证系统记录但不强制 -- 角色即使 UNAVAILABLE 也可以接受生产任务，
  #          但产出标记为 UNCERTIFIED。
  enabled: true

  # 严格模式。
  #   true:  未认证角色完全不能接生产任务；gate_guard 在 PreToolUse 时额外检查
  #          被启动角色是否持有有效认证，无认证则阻断（exit 2）。
  #   false: 未认证角色可以接生产任务但产出带 UNCERTIFIED 标记；
  #          下游角色验收时可以据此拒收。
  strict_mode: true

  # 默认重认证周期（天）。
  # 每个角色的具体有效期定义在 role-capability-profiles.md 的 capability_expiry_policy 中。
  # 此值作为未在 profiles 中明确指定有效期时的回退默认值。
  revalidate_interval_days: 30

  # 连续失败多少次触发降级。
  # 角色在同一 task_type 上连续被下游角色拒收达到此次数后，
  # 自动触发 CAPABILITY_DEGRADED（降级该 task_type）。
  # 超过此次数 --> REVALIDATION_REQUIRED（见 degradation.rules）。
  max_consecutive_failures: 3

  # 认证过期宽限期（天）。
  # 认证过期后在此天数内角色仍保持 CERTIFIED 状态但附加 warning。
  # 宽限期结束后自动降级为 REVALIDATION_REQUIRED。
  grace_period_days: 7

  # 认证挑战最大连续尝试次数。
  # 角色连续挑战失败达到此次数后，触发 REVALIDATION_REQUIRED，
  # 需要等待 cooling_period_days 后才能再次挑战。
  max_consecutive_challenge_attempts: 3

  # 挑战失败后的冷静期（天）。
  cooling_period_days: 7

  # 认证记录的保留策略。
  record_retention:
    # 每个角色保留最近 N 条认证记录（旧记录归档至 archive/）
    max_records_per_role: 5
    # 归档目录（相对于 .ai/certifications/）
    archive_dir: archive
    # 紧急覆盖记录的独立存储目录
    overrides_dir: overrides

# ── 降级规则配置 ──
# 定义什么情况下降级到哪个状态。每条规则是"条件 --> 目标状态"的映射。
# 由 main-thread 在每次角色任务完成后，根据规则条件评估是否触发降级。

degradation:
  rules:
    # ── 降级为 CAPABILITY_UNAVAILABLE ──

    # 规则 DEGR-001：核心工具不可用
    - id: DEGR-001
      description: "核心工具不可用导致 CAPABILITY_UNAVAILABLE"
      condition:
        type: tool_unavailable
        detail: "角色的 required_tools 中标注为'不可用时 --> CAPABILITY_UNAVAILABLE'的工具不可用"
      target_state: CAPABILITY_UNAVAILABLE
      automatic: true
      requires_human_approval: false

    # ── 降级为 CAPABILITY_DEGRADED ──

    # 规则 DEGR-002：非核心工具不可用导致部分降级
    - id: DEGR-002
      description: "非核心工具不可用导致 CAPABILITY_DEGRADED"
      condition:
        type: tool_unavailable
        detail: "角色的 required_tools 中标注为'不可用时 --> CAPABILITY_DEGRADED'的工具不可用"
      target_state: CAPABILITY_DEGRADED
      target_detail: "降级受影响的 task_type -- 角色可接受未降级的 task_type"
      automatic: true
      requires_human_approval: false

    # 规则 DEGR-003：同一 task_type 连续 2 次下游拒收
    - id: DEGR-003
      description: "同一 task_type 连续 2 次下游拒收导致 CAPABILITY_DEGRADED"
      condition:
        type: consecutive_failure
        threshold: 2
        scope: same_task_type
        detail: "角色在特定 task_type 上连续 N 次产出被下游角色拒收（包含 P0 finding）"
      target_state: CAPABILITY_DEGRADED
      target_detail: "降级该 task_type"
      automatic: true
      requires_human_approval: false

    # ── 降级为 REVALIDATION_REQUIRED ──

    # 规则 DEGR-004：连续 max_consecutive_failures 次下游拒收
    - id: DEGR-004
      description: "同一 task_type 连续 max_consecutive_failures 次下游拒收导致 REVALIDATION_REQUIRED"
      condition:
        type: consecutive_failure
        threshold: "$certification.max_consecutive_failures"   # 继承全局配置的值，默认 3
        scope: same_task_type
        detail: "超过最大连续失败阈值，触发完整重新认证"
      target_state: REVALIDATION_REQUIRED
      automatic: true
      requires_human_approval: false

    # 规则 DEGR-005：认证过期超过宽限期
    - id: DEGR-005
      description: "认证过期（超过宽限期）导致 REVALIDATION_REQUIRED"
      condition:
        type: certification_expired
        detail: "当前日期 > expiry_date + grace_period_days"
      target_state: REVALIDATION_REQUIRED
      automatic: true
      requires_human_approval: false

    # 规则 DEGR-006：技术栈主版本升级
    - id: DEGR-006
      description: "supported_stacks 中主要技术栈主版本升级导致 REVALIDATION_REQUIRED"
      condition:
        type: stack_major_upgrade
        detail: "如 Python 3.x --> 4.x, Node.js 20.x --> 21.x 等主版本号变更"
      target_state: REVALIDATION_REQUIRED
      automatic: true
      requires_human_approval: false

    # 规则 DEGR-007：关键配置变更
    - id: DEGR-007
      description: "config.yaml 中角色相关关键配置变更导致 REVALIDATION_REQUIRED"
      condition:
        type: config_change
        detail: "影响该角色的 quality_gates 配置（质量工程师）、security_gates 配置（安全工程师）或角色合同变更"
      target_state: REVALIDATION_REQUIRED
      automatic: true
      requires_human_approval: false

    # 规则 DEGR-008：认证挑战连续失败
    - id: DEGR-008
      description: "认证挑战连续 max_consecutive_challenge_attempts 次失败导致 REVALIDATION_REQUIRED"
      condition:
        type: consecutive_challenge_failure
        threshold: "$certification.max_consecutive_challenge_attempts"
        detail: "需要等待 cooling_period_days 后才能再次挑战"
      target_state: REVALIDATION_REQUIRED
      automatic: true
      requires_human_approval: false

    # ── 降级为 ROLE_BLOCKED（需人工恢复） ──

    # 规则 DEGR-009：生产事故
    - id: DEGR-009
      description: "角色的结论导致生产事故 --> ROLE_BLOCKED"
      condition:
        type: production_incident
        detail: "角色的结论（或漏检）导致生产事故，如安全工程师漏检的漏洞被利用、交付经理漏检的部署缺陷导致回滚失败"
      target_state: ROLE_BLOCKED
      automatic: true                   # 自动触发封锁，但恢复需要人工
      requires_human_approval: true     # 恢复需要人工批准
      incident_tracking: true

    # 规则 DEGR-010：连续 5 次严重失败
    - id: DEGR-010
      description: "角色连续 5 次产出被下游拒收且同类问题无改进 --> ROLE_BLOCKED"
      condition:
        type: consecutive_failure
        threshold: 5
        scope: any_task_type           # 不限于同一 task_type
        detail: "跨 task_type 的持续失败，且同类问题无改进迹象"
      target_state: ROLE_BLOCKED
      automatic: false                  # 需人工复核后封锁
      requires_human_approval: true
      human_review_required: true

    # 规则 DEGR-011：伪造证据
    - id: DEGR-011
      description: "独立评审发现角色伪造工具输出或编造证据 --> ROLE_BLOCKED"
      condition:
        type: evidence_fabrication
        detail: "伪造工具输出、编造文件路径、声称运行了实际未执行的脚本"
      target_state: ROLE_BLOCKED
      automatic: true                   # 零容忍，立即封锁
      requires_human_approval: true

    # 规则 DEGR-012：越权行为
    - id: DEGR-012
      description: "角色执行了合同明确禁止的事项 --> ROLE_BLOCKED"
      condition:
        type: contract_violation
        detail: "执行了 12 字段合同中'明确禁止'部分所列事项"
      target_state: ROLE_BLOCKED
      automatic: true
      requires_human_approval: true

    # 规则 DEGR-013：工具大面积不可用
    - id: DEGR-013
      description: "超过 50% required_tools 不可用且角色仍在接受任务 --> ROLE_BLOCKED"
      condition:
        type: tool_mass_unavailable
        threshold: 0.5                  # 50%
        detail: "角色应自行检测并返回 CAPABILITY_UNAVAILABLE，未检测说明自我诊断机制失效"
      target_state: ROLE_BLOCKED
      automatic: false
      requires_human_approval: true

    # ── 观察期规则 ──

    # 规则 DEGR-014：ROLE_BLOCKED 恢复后的观察期
    - id: DEGR-014
      description: "ROLE_BLOCKED 恢复后有 60 天观察期（probation）"
      condition:
        type: probation
        detail: "观察期内任何 P0 finding --> 立即回到 ROLE_BLOCKED；P1 finding --> 观察期延长 30 天"
      target_state: null                # 不直接触发状态变更，而是改变失效阈值
      probation_days: 60
      probation_extension_per_p1: 30
      automatic: true
      requires_human_approval: false

  # 降级决策的审计要求
  audit:
    # 每次降级/恢复变更写入审计日志
    log_all_transitions: true
    # 审计日志路径（相对于项目根）
    log_path: ".ai/certifications/audit.log"
    # 日志格式：每行一个 JSON 事件
    # {"timestamp":"...", "event":"state_change", "role_id":"...", "from":"...", "to":"...", "rule_id":"...", "triggered_by":"..."}
